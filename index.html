<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Santa's Workshop - Christmas Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div id="score-display">Toys Made: <span id="toys-count">0</span></div>
            <div id="timer-display">Time: <span id="time">60</span>s</div>
            <div id="instructions"></div>
            <div id="debug-log" style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #0f0; padding: 10px; font-family: monospace; font-size: 10px; max-width: 300px; pointer-events: none;"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
